services:
  immich-people-plus-api:
    build: .
    container_name: immich-people-plus-api
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - default
      - immich

networks:
  immich:
    # Docker network of the Immich compose project, so DATABASE_URL can point at
    # immich_postgres by container name: `docker network ls | grep immich`
    external: true
    name: ${IMMICH_NETWORK:-immich_default}
